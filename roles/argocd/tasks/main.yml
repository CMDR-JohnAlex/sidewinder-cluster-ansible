---
- name: Create temporary directory for ArgoCD manifests
  become: true
  ansible.builtin.file:
    path: /tmp/argocd
    state: directory
    mode: "0755"

- name: Copy kustomization.yaml to remote host
  become: true
  ansible.builtin.copy:
    src: kustomization.yaml
    dest: /tmp/argocd/kustomization.yaml
    mode: "0644"

- name: Create argocd namespace
  become: true
  ansible.builtin.shell: |
    kubectl create namespace argocd \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Install ArgoCD HA
  become: true
  ansible.builtin.command:
    cmd: kubectl apply -n argocd --server-side --force-conflicts -k /tmp/argocd/
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: argocd_apply

- name: Show kubectl output
  ansible.builtin.debug:
    var: argocd_apply.stdout_lines

- name: Wait for ArgoCD deployment rollout
  become: true
  command: >
    kubectl rollout status deployment/argocd-server
    --namespace=argocd
    --timeout=900s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: rollout_result
  changed_when: false

- name: Show kubectl rollout output
  ansible.builtin.debug:
    var: rollout_result.stdout_lines

- name: Download bootstrap.yaml to remote host
  become: true
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/CMDR-JohnAlex/sidewinder-cluster-gitops/main/bootstrap/root-app.yaml
    dest: /tmp/argocd/bootstrap.yaml
    mode: '0644'

- name: Bootstrap GitOps
  become: true
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/argocd/bootstrap.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: argocd_bootstrap

- name: Show kubectl output
  ansible.builtin.debug:
    var: argocd_bootstrap.stdout_lines
