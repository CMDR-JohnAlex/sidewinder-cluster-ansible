---
- name: Bootstrap the first control plane node
  become: true
  ansible.builtin.command: >
    kubeadm init
    --apiserver-advertise-address={{ ansible_host }}
    --control-plane-endpoint={{ control_plane_VIP }}:{{ control_plane_VIP_port }}
    --upload-certs
    --pod-network-cidr={{ pod_network_cidr }}
  args:
    creates: /etc/kubernetes/admin.conf # TODO: When we teardown the cluster, remember to delete this file.

# NOTE: Generates fresh certs in case the cluster was already up.
- name: Generate/Upload control plane certs and get certificate key
  become: true
  command: kubeadm init phase upload-certs --upload-certs
  register: upload_certs

- name: Extract certificate key
  set_fact:
    kubeadm_certificate_key: >-
      {{
        upload_certs.stdout_lines[-1]
      }}

- name: Generate control plane join command
  become: true
  command: >
    kubeadm token create
    --print-join-command
    --certificate-key {{ kubeadm_certificate_key }}
  register: controlplane_join

- name: Generate worker join command
  become: true
  command: kubeadm token create --print-join-command
  register: worker_join

