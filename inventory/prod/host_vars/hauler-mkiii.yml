---
nfs_drives: # NOTE: To find UUID: `sudo lsblk -o NAME,LABEL,FSTYPE,UUID,MOUNTPOINT,FSUSED,FSAVAIL,FSUSE%,FSSIZE`

  # USB STICK
  - uuid: "8dafdf36-cb0f-4102-a05e-d69ea5954303"
    format: "ext4"
    kubernetes_subdirectory: "sidewinder-nfs"
    authorized_hosts:
      - "192.168.7.0/24"
      - "192.168.0.7"
      - "192.168.0.11"
    filesystem_mount_options: "defaults,noatime,commit=60,nofail"
    export_options: "rw,async,no_subtree_check,no_root_squash,fsid=1" # WARN: async means ACKs are sent before data actually finishes writing... we should consider this choice carefully!

  # HARD DRIVE 1
  - uuid: "e9642e46-dd2e-4900-be52-4eb23e67cbf5"
    format: "ext4"
    kubernetes_subdirectory: "sidewinder-nfs"
    authorized_hosts:
      - "192.168.7.0/24"
      - "192.168.0.7"
      - "192.168.0.11"
    filesystem_mount_options: "defaults,noatime,nodiratime,commit=60,nofail"
    export_options: "rw,async,no_subtree_check,no_root_squash,fsid=2"

  # HARD DRIVE 2
  - uuid: "7174939d-4158-40a9-88ee-b6acc4b71216"
    format: "ext4"
    kubernetes_subdirectory: "sidewinder-nfs"
    authorized_hosts:
      - "192.168.7.0/24"
      - "192.168.0.7"
      - "192.168.0.11"
    filesystem_mount_options: "defaults,noatime,nodiratime,commit=60,nofail"
    export_options: "rw,async,no_subtree_check,no_root_squash,fsid=3"
